---
name: Create release on tag push
on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    uses: rkosegi/github-workflows/.github/workflows/release-on-tag.yaml@0d4e4f7bbc5c7977f4fd93f184c3157f8343bd34 # v0.0.6
